<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Wynn Housing Homeowner Manual with English and Traditional Chinese language toggle.">
<title>Homeowner Manual · Wynn Housing</title>
<style>

  :root{
    --bg:      oklch(97% 0.012 80);
    --surface: oklch(99% 0.005 80);
    --fg:      oklch(20% 0.02 60);
    --muted:   oklch(48% 0.015 60);
    --border:  oklch(89% 0.012 80);
    --accent:  oklch(58% 0.16 35);
    --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --ink:var(--fg);
    --ink-rgb:45,36,30;
    --paper:var(--bg);
    --paper-rgb:247,244,237;
    --paper-tint:oklch(93% 0.014 80);
    --ink-tint:oklch(25% 0.02 60);
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --serif-en:var(--font-display);
    --serif-zh:'Songti TC','Noto Serif TC','PingFang TC','Iowan Old Style','Charter',Georgia,serif;
    --sans-zh:'PingFang TC','Noto Sans TC','Heiti TC',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--sans-zh);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  canvas.bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block;transition:opacity 1.2s ease}
  canvas#bg-light{opacity:0}
  canvas#bg-dark{opacity:1}
  body.light-bg canvas#bg-light{opacity:1}
  body.light-bg canvas#bg-dark{opacity:0}
  #deck{position:fixed;inset:0;width:10000vw;height:100vh;display:flex;flex-wrap:nowrap;transition:transform .9s cubic-bezier(.77,0,.175,1);z-index:10;will-change:transform}
  .slide{width:100vw;height:100vh;flex:0 0 100vw;position:relative;padding:6vh 6vw 10vh;display:flex;flex-direction:column;overflow:hidden;letter-spacing:0}
  .slide.light{color:var(--ink)}
  .slide.dark{color:var(--paper)}
  .slide::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;transition:background .7s ease}
  .slide.light::before{background:rgba(var(--paper-rgb),.78);backdrop-filter:blur(3px)}
  .slide.dark::before{background:rgba(var(--ink-rgb),.78);backdrop-filter:blur(3px)}
  .slide.hero.light::before{background:rgba(var(--paper-rgb),.16);backdrop-filter:none}
  .slide.hero.dark::before{background:rgba(var(--ink-rgb),.12);backdrop-filter:none}
  .slide.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none}
  .slide.hero.light::after{background:linear-gradient(180deg,rgba(var(--paper-rgb),.28),rgba(var(--paper-rgb),0) 14%,rgba(var(--paper-rgb),0) 86%,rgba(var(--paper-rgb),.28))}
  .slide.hero.dark::after{background:linear-gradient(180deg,rgba(var(--ink-rgb),.32),rgba(var(--ink-rgb),0) 14%,rgba(var(--ink-rgb),0) 86%,rgba(var(--ink-rgb),.32))}
  .chrome{display:flex;justify-content:space-between;align-items:flex-start;font-family:var(--mono);font-size:max(11px,.78vw);letter-spacing:.2em;text-transform:uppercase;opacity:.62}
  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--mono);font-size:max(11px,.78vw);letter-spacing:.18em;text-transform:uppercase;opacity:.5}
  .foot .title{font-family:var(--serif-zh);font-weight:400;letter-spacing:.05em;text-transform:none;opacity:.75;font-size:13px}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-bottom:2.6vh}
  .h-hero{font-family:var(--serif-zh);font-weight:900;font-size:10vw;line-height:.96;letter-spacing:-.02em}
  .h-xl{font-family:var(--serif-zh);font-weight:700;font-size:6.2vw;line-height:1.08;letter-spacing:-.01em}
  .h-sub{font-family:var(--serif-zh);font-weight:500;font-size:3.1vw;line-height:1.25;letter-spacing:0;opacity:.7}
  .h-hero-en,.h-xl-en{font-family:var(--serif-en);letter-spacing:-.025em}
  .lead{font-family:var(--serif-zh);font-weight:400;font-size:1.75vw;line-height:1.5;opacity:.86}
  .meta-row{display:flex;gap:1.2em;align-items:baseline;flex-wrap:wrap;font-family:var(--mono);font-size:max(12px,.92vw);letter-spacing:.16em;text-transform:uppercase;opacity:.6}
  .frame{flex:1;display:flex;flex-direction:column;min-height:0}
  .grid-6{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:4vw 6vw;flex:1;align-content:center;padding:2vh 0}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:4vw;flex:1;align-content:center}
  .grid-2-7-5{display:grid;grid-template-columns:7fr 5fr;gap:3vw 4vh;align-items:start}
  .grid-2-6-6{display:grid;grid-template-columns:1fr 1fr;gap:3vw 4vh;align-items:start}
  .stat-card{display:flex;flex-direction:column;gap:.8vh;align-items:flex-start;padding-top:1.6vh;border-top:1px solid currentColor;border-color:rgba(127,127,127,.3)}
  .stat-card .stat-label{font-family:var(--mono);font-size:max(10px,.78vw);letter-spacing:.24em;text-transform:uppercase;opacity:.55}
  .stat-card .stat-nb{font-family:var(--serif-en);font-weight:800;font-size:5.8vw;line-height:.9;letter-spacing:-.03em;font-feature-settings:"tnum";margin-top:.4vh}
  .stat-card .stat-note{font-family:var(--sans-zh);font-weight:400;font-size:max(13px,1.05vw);line-height:1.5;opacity:.72;margin-top:.6vh}
  .grid-3 .stat-card .stat-nb{font-size:6.8vw}
  .pipeline-section{margin-top:4.4vh;padding-top:2.8vh;border-top:1px dashed rgba(127,127,127,.32)}
  .pipeline-section:first-of-type{border-top:0;padding-top:0;margin-top:3vh}
  .pipeline-label{font-family:var(--mono);font-size:max(11px,.85vw);letter-spacing:.24em;text-transform:uppercase;opacity:.62;margin-bottom:2.2vh}
  .pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2vw}
  .pipeline[data-cols="4"]{grid-template-columns:repeat(4,1fr)}
  .step{display:flex;flex-direction:column;gap:.8vh;padding-top:1.4vh;border-top:1px solid currentColor;border-color:rgba(127,127,127,.35)}
  .step-nb{font-family:var(--serif-en);font-style:italic;font-weight:500;font-size:1.15vw;opacity:.45}
  .step-title{font-family:var(--sans-zh);font-weight:700;font-size:1.55vw;letter-spacing:.01em;line-height:1.2}
  .step-desc{font-family:var(--sans-zh);font-weight:400;font-size:max(12px,.95vw);line-height:1.45;opacity:.72}
  .callout{padding:3vh 2.4vw;border-left:3px solid currentColor;position:relative;font-family:var(--serif-zh);font-size:max(15px,1.2vw);line-height:1.55;opacity:.92}
  .slide.light .callout{background:rgba(var(--ink-rgb),.05)}
  .slide.dark .callout{background:rgba(var(--paper-rgb),.06)}
  .manual-list{display:flex;flex-direction:column;gap:1.5vh;font-family:var(--font-body);font-size:max(15px,1.12vw);line-height:1.55;opacity:.82}
  .manual-list strong{font-weight:600;color:currentColor}
  .manual-list li{margin-left:1.05em;padding-left:.25em}
  .manual-card{padding:2.2vh 1.8vw;border-top:1px solid currentColor;border-color:rgba(127,127,127,.32)}
  .manual-card h3{font-family:var(--font-display);font-size:1.75vw;line-height:1.18;font-weight:500;margin-bottom:1.1vh}
  .manual-card p{font-family:var(--font-body);font-size:max(13px,1vw);line-height:1.55;opacity:.76}
  .fine-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2.5vh 2.8vw}
  .county-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2vh 3vw;margin-top:4vh}
  .county{border-top:1px solid currentColor;border-color:rgba(127,127,127,.35);padding-top:1.4vh}
  .county b{display:block;font-family:var(--font-display);font-size:1.5vw;font-weight:500;margin-bottom:.8vh}
  .county span{font-family:var(--mono);font-size:max(10px,.78vw);letter-spacing:.08em;opacity:.65;word-break:break-all;text-transform:none}
  .notice{border:1px solid currentColor;border-color:rgba(127,127,127,.32);padding:2.4vh 2vw;background:rgba(var(--paper-rgb),.05)}
  .slide.light .notice{background:rgba(var(--ink-rgb),.035)}
  #nav{position:fixed;left:50%;bottom:2.6vh;transform:translateX(-50%);z-index:30;display:flex;gap:10px;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.18);backdrop-filter:blur(10px)}
  #nav .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:all .3s ease;border:0;padding:0}
  #nav .dot.active{background:rgba(255,255,255,.95);width:22px;border-radius:999px}
  body.light-bg #nav{background:rgba(255,255,255,.25)}
  body.light-bg #nav .dot{background:rgba(var(--ink-rgb),.25)}
  body.light-bg #nav .dot.active{background:rgba(var(--ink-rgb),.9)}
  #hint{position:fixed;bottom:3vh;right:3vw;z-index:30;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.4;mix-blend-mode:difference;color:#aaa}
  @media (max-width:900px){
    .h-hero{font-size:14vw}
    .h-xl{font-size:9vw}
    .pipeline{grid-template-columns:repeat(2,1fr)}
    .grid-2-7-5,.grid-2-6-6{grid-template-columns:1fr}
  }
  @media print{
    @page{size:16in 9in;margin:0}
    html,body{width:auto;height:auto;overflow:visible;background:var(--paper)}
    canvas.bg,#nav,#hint,#overview{display:none!important}
    #deck{position:static!important;display:block!important;width:auto!important;height:auto!important;transform:none!important;transition:none!important}
    .slide{position:relative!important;width:16in!important;height:9in!important;page-break-after:always;break-after:page;overflow:hidden}
    .slide::before{backdrop-filter:none!important}
    .slide:last-child{page-break-after:auto;break-after:auto}
  }

  .language-switcher{position:fixed;top:2.4vh;right:3vw;z-index:40;display:flex;gap:6px;padding:6px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(0,0,0,.22);backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(0,0,0,.16)}
  .language-switcher button{border:0;border-radius:999px;padding:8px 13px;background:transparent;color:rgba(255,255,255,.72);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .2s ease,color .2s ease,transform .2s ease}
  .language-switcher button:hover{transform:translateY(-1px);color:#fff}
  .language-switcher button.active{background:rgba(255,255,255,.9);color:var(--ink)}
  body.light-bg .language-switcher{background:rgba(255,255,255,.3);border-color:rgba(var(--ink-rgb),.12)}
  body.light-bg .language-switcher button{color:rgba(var(--ink-rgb),.68)}
  body.light-bg .language-switcher button:hover{color:var(--ink)}
  body.light-bg .language-switcher button.active{background:rgba(var(--ink-rgb),.9);color:var(--paper)}
  @media (max-width:700px){
    .language-switcher{top:1.6vh;right:3vw}
    .language-switcher button{padding:7px 10px;font-size:10px}
    #hint{display:none}
  }
  @media print{.language-switcher{display:none!important}}
</style>
</head>
<body>
<canvas id="bg-dark" class="bg"></canvas>
<canvas id="bg-light" class="bg"></canvas>
<div class="language-switcher" role="group" aria-label="Language selector">
  <button type="button" data-lang="zh" class="active" aria-pressed="true">中文</button>
  <button type="button" data-lang="en" aria-pressed="false">English</button>
</div>
<div id="hint">← → 投影片 · ESC 總覽</div>
<div id="deck"></div>
<div id="nav"></div>
<template id="slides-zh">
<section class="slide hero dark" data-theme="dark" data-screen-label="01 封面">
  <div class="chrome"><div>Wynn Housing | eXp Realty</div><div>屋主手冊</div></div>
  <div class="frame" style="display:grid;gap:4vh;align-content:center;min-height:80vh">
    <div class="kicker">歡迎資料包</div>
    <h1 class="h-hero" style="font-size:8.3vw;max-width:78vw">歡迎回家，<br>親愛的屋主。</h1>
    <h2 class="h-sub" style="font-size:2.9vw;max-width:64vw">安心展開屋主生活的必備指南</h2>
    <p class="lead" style="max-width:58vw;font-family:var(--font-body);font-size:1.35vw;line-height:1.65">恭喜您擁有美麗的新家。這份指南是我們送給您的實用資源，陪伴您度過入住後的前幾個月，以及未來的屋主生活。每一步，我們都會在您身邊。</p>
  </div>
  <div class="foot"><div class="title">Wynn Housing | eXp Realty</div><div>01 / 11</div></div>
</section>
<section class="slide light" data-theme="light" data-screen-label="02 目錄">
  <div class="chrome"><div>導覽 · 指南地圖</div><div>02 / 11</div></div>
  <div class="frame" style="padding-top:5vh">
    <div class="kicker">從完成交屋到安心持有</div>
    <h2 class="h-xl" style="font-size:5.2vw;max-width:72vw">您需要知道的一切，逐步整理在這裡。</h2>
    <div class="grid-6" style="margin-top:6vh">
      <div class="stat-card"><div class="stat-label">第一步</div><div class="stat-nb">01</div><div class="stat-note">確保居家安全，順利安頓入住。</div></div>
      <div class="stat-card"><div class="stat-label">官方文件</div><div class="stat-nb">02</div><div class="stat-note">了解重要文件，避免詐騙陷阱。</div></div>
      <div class="stat-card"><div class="stat-label">財務管理</div><div class="stat-nb">03</div><div class="stat-note">房產稅、帳單與關鍵支出。</div></div>
      <div class="stat-card"><div class="stat-label">房屋維護</div><div class="stat-nb">04</div><div class="stat-note">主動保護您房產投資的指南。</div></div>
      <div class="stat-card"><div class="stat-label">支援網絡</div><div class="stat-nb">05</div><div class="stat-note">可信賴的廠商與保固基本知識。</div></div>
      <div class="stat-card"><div class="stat-label">隨手保存</div><div class="stat-nb">06</div><div class="stat-note">建議在入住第一年妥善保存本手冊。</div></div>
    </div>
  </div>
  <div class="foot"><div class="title">目錄 · 從交屋到安心持有</div><div>指南地圖</div></div>
</section>
<section class="slide dark" data-theme="dark" data-screen-label="03 立即待辦">
  <div class="chrome"><div>第一章 · 入住第一步</div><div>03 / 11</div></div>
  <div class="frame grid-2-7-5" style="padding-top:6vh">
    <div>
      <div class="kicker">第一章</div>
      <h2 class="h-xl" style="font-size:4.7vw">您的立即待辦清單</h2>
      <p class="lead" style="font-family:var(--font-body);font-size:1.25vw;margin-top:3vh;max-width:48vw">最優先處理的是居家安全、水電網路、HOA 登記，以及確保郵件能正確送達。</p>
    </div>
    <div class="fine-grid" style="grid-template-columns:1fr">
      <div class="manual-card"><h3>更換門鎖</h3><p>請把這件事列為第一優先。也可考慮安裝智慧門鎖提升便利性，並更新所有門鎖密碼，讓自己更安心。</p></div>
      <div class="manual-card"><h3>開通水電與服務</h3><p>設定網路、自來水、電力、瓦斯與保全系統。可參考我們 email 中賣方提供的 utility 資訊表。</p></div>
      <div class="manual-card"><h3>向 HOA 登記</h3><p>聯絡社區管理協會，登記為新屋主，建立線上帳號，並設定每月管理費自動付款。</p></div>
      <div class="manual-card"><h3>更新郵寄地址</h3><p>向 USPS 變更地址，確保稅單、保險文件與其他重要郵件都能寄達。</p></div>
    </div>
  </div>
  <div class="foot"><div class="title">安全 · 開通 · 登記 · 轉寄</div><div>入住第一步</div></div>
</section>
<section class="slide light" data-theme="light" data-screen-label="04 官方文件">
  <div class="chrome"><div>第二章 · 官方文件</div><div>04 / 11</div></div>
  <div class="frame" style="padding-top:4vh">
    <div class="kicker">重要文件將陸續寄達</div>
    <h2 class="h-xl" style="font-size:4.7vw;margin-bottom:4vh">以下是您可以預期收到的文件。</h2>
    <div class="grid-2-6-6" style="gap:5vw">
      <div>
        <div class="pipeline-label">來自縣市政府 · 約 6-8 週內</div>
        <ul class="manual-list">
          <li><strong>產權登記契據：</strong>正式的屋主權益證明。紙本會郵寄給您；電子版我們已經先寄給您。</li>
          <li><strong>補充房產稅單：</strong>重要且有付款期限。更多說明請見財務章節。</li>
          <li><strong>PCOR 表格：</strong>產權變更申報表。如適用，請勾選「Primary Resident」。</li>
          <li><strong>屋主稅務減免表：</strong>當您申報此房屋為自住房時使用。</li>
        </ul>
      </div>
      <div>
        <div class="pipeline-label">來自產權公司</div>
        <ul class="manual-list">
          <li><strong>產權保險保單：</strong>保障您屋主權益的保險文件。</li>
          <li><strong>信託契據：</strong>記錄您與貸款機構之間的房貸關係。</li>
          <li><strong>Escrow 退款：</strong>如 escrow 帳戶仍有餘額，您可能會收到退款支票。</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="foot"><div class="title">文件 · 縣市政府與產權公司</div><div>文件事項</div></div>
</section>
<section class="slide hero light" data-theme="light" data-screen-label="05 詐騙提醒">
  <div class="chrome"><div>第二章 · 詐騙提醒</div><div>05 / 11</div></div>
  <div class="frame" style="display:grid;gap:3.5vh;align-content:center;min-height:80vh">
    <div class="kicker">不要為 Grant Deed 副本付費</div>
    <h1 class="h-hero" style="font-size:6.4vw;line-height:1.05;max-width:78vw">看起來像官方文件，不一定真的是官方文件。</h1>
    <div class="grid-2-6-6" style="gap:4vw;align-items:start">
      <div class="notice"><p class="manual-list" style="display:block;font-size:1.05vw"><strong>常見手法：</strong>詐騙者利用公開交易紀錄寄信，要求您支付約 $100 以取得「Recorded Deed」或「Grant Deed」。小字通常會註明他們並非政府機關。</p></div>
      <div class="notice"><p class="manual-list" style="display:block;font-size:1.05vw"><strong>實際情況：</strong>您的 grant deed 可向 title 或 escrow 公司免費取得電子副本，County Recorder 也能直接提供副本。</p></div>
    </div>
    <p class="lead" style="font-family:var(--font-body);font-size:1.18vw;max-width:72vw">您的產權是由已登記的公共紀錄確立，不是靠手上是否持有紙本契據。如果任何文件要求付款，請先拍照傳給我們確認，再採取行動。</p>
  </div>
  <div class="foot"><div class="title">防詐提醒 · 付款前先確認</div><div>產權已受保障</div></div>
</section>
<section class="slide dark" data-theme="dark" data-screen-label="06 加州房產稅">
  <div class="chrome"><div>第三章 · 財務管理</div><div>06 / 11</div></div>
  <div class="frame" style="padding-top:5vh">
    <div class="kicker">了解您的加州房產稅</div>
    <h2 class="h-xl" style="font-size:4.9vw;margin-bottom:5vh">稅單寄到前，先掌握重要時程。</h2>
    <div class="grid-3">

const mouse={x:.5,y:.5};addEventListener('mousemove',e=>{mouse.x=e.clientX/innerWidth;mouse.y=e.clientY/innerHeight});

const deck=document.getElementById('deck'),nav=document.getElementById('nav'),hint=document.getElementById('hint'),langButtons=document.querySelectorAll('.language-switcher button');
const STORAGE_KEY='wynn-homeowner-manual-state';
let state={lang:'zh',slideByLang:{zh:0,en:0}};
try{state={...state,...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}}catch{}
let slides=[],idx=0,total=0,lock=false,overviewOn=false,ov=null;
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function setLanguage(lang){
  if(!['zh','en'].includes(lang)) lang='zh';
  state.lang=lang;
  document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
  document.title=lang==='zh'?'屋主手冊 · Wynn Housing':'Homeowner Manual · Wynn Housing';
  hint.textContent=lang==='zh'?'← → 投影片 · ESC 總覽':'← → Slides · ESC Index';
  const tpl=document.getElementById('slides-'+lang);
  deck.innerHTML=tpl.innerHTML;
  slides=Array.from(deck.querySelectorAll('.slide'));
  total=slides.length;
  deck.style.width=total*100+'vw';
  nav.innerHTML='';
  slides.forEach((s,i)=>{const b=document.createElement('button');b.className='dot';b.dataset.i=i;b.setAttribute('aria-label',lang==='zh'?'第 '+(i+1)+' 頁':'Page '+(i+1));b.onclick=()=>go(i);nav.appendChild(b)});

}
function go(n,immediate=false){
  if(lock&&!immediate)return;
  idx=Math.max(0,Math.min(total-1,n));
  deck.style.transform='translateX('+(-idx*100)+'vw)';
  slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
  nav.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
  const el=slides[idx];
  const th=el?.dataset.theme||(el?.classList.contains('light')?'light':'dark');
  document.body.classList.toggle('light-bg',th==='light');
  state.slideByLang[state.lang]=idx;
  saveState();
  lock=true;
  setTimeout(()=>lock=false,immediate?0:700);
}

  if(ov)return ov;

  ov.id='overview';

  document.body.appendChild(ov);
  return ov;
}

  const panel=ensureOverview();panel.innerHTML='';
  const grid=document.createElement('div');
  grid.style.cssText='display:grid;grid-template-columns:repeat(4,1fr);gap:2vh 1.6vw;max-width:90vw;margin:0 auto';

  panel.appendChild(grid);
}
function toggleOverview(){overviewOn=!overviewOn;const panel=ensureOverview();if(overviewOn){buildOverview();panel.style.display='block'}else panel.style.display='none'}
langButtons.forEach(btn=>btn.addEventListener('click',()=>setLanguage(btn.dataset.lang)));

let wheelTO=null,wheelAcc=0;addEventListener('wheel',e=>{wheelAcc+=e.deltaY+e.deltaX;if(Math.abs(wheelAcc)>50){go(idx+(wheelAcc>0?1:-1));wheelAcc=0}clearTimeout(wheelTO);wheelTO=setTimeout(()=>wheelAcc=0,150)},{passive:true});
